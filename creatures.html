<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="i18n-title" content="title.bestiary">
  <title>Sonaria Duelos</title>
  <script>try { const t = localStorage.getItem("sd-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=25">
</head>
<body data-page="creatures">
  <main class="container" style="padding-bottom:40px">
    <div class="page-head">
      <div><span class="kicker" data-i18n="nav.bestiary"></span><h1 data-i18n="best.title"></h1></div>
      <p id="count"></p>
    </div>
    <div id="filters"></div>
    <div class="creature-grid" id="grid"></div>
  </main>

  <script src="js/i18n.js?v=25"></script>
  <script src="js/lang/pt-BR.js?v=25"></script>
  <script src="js/lang/pt-PT.js?v=25"></script>
  <script src="js/lang/en.js?v=25"></script>
  <script src="js/lang/es.js?v=25"></script>
  <script src="js/lang/fr.js?v=25"></script>
  <script src="js/lang/de.js?v=25"></script>
  <script src="js/layout.js?v=25"></script>
  <script src="js/creatures-data.js?v=25"></script>
  <script src="js/data.js?v=25"></script>
  <script>
    document.getElementById("filters").innerHTML = filterToolbarHTML("f-");
    const grid = document.getElementById("grid");
    const updated = new Intl.DateTimeFormat(LOCALE).format(new Date(CREATURES_UPDATED + "T12:00:00"));
    bindFilters("f-", f => {
      const list = filterCreatures(f);
      document.getElementById("count").textContent = t("best.count", { a: list.length, b: CREATURES.length, d: updated });
      renderCards(grid, list);
    });
    grid.addEventListener("click", e => {
      const card = e.target.closest(".c-card");
      if (card) location.href = `simulator.html?c1=${encodeURIComponent(CREATURES[+card.dataset.idx].name)}`;
    });
  </script>
</body>
</html>
