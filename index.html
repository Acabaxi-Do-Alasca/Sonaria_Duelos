<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="i18n-title" content="title.home">
  <title>Sonaria Duelos</title>
  <script>try { const t = localStorage.getItem("sd-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=25">
</head>
<body data-page="home">
  <main class="container">
    <section class="home-hero">
      <div>
        <span class="kicker" data-i18n="home.kicker"></span>
        <h1><span data-i18n="home.h1a"></span> <i data-i18n="home.h1b"></i></h1>
        <p class="lead" data-i18n="home.lead"></p>
        <div class="hero-actions">
          <a href="simulator.html" class="btn btn-primary" data-i18n="home.ctaSim"></a>
          <a href="creatures.html" class="btn btn-ghost" data-i18n="home.ctaBest"></a>
        </div>
        <div class="facts">
          <div><b id="f-count">—</b><span data-i18n="home.factCreatures"></span></div>
          <div><b>35</b><span data-i18n="home.factPlush"></span></div>
          <div><b>23</b><span data-i18n="home.factActives"></span></div>
        </div>
      </div>

      <aside class="feature-duel" id="feature">
        <header><span class="kicker" data-i18n="home.featured"></span><button class="btn btn-ghost" id="reroll" style="padding:6px 10px;font-size:13px" data-i18n="home.reroll"></button></header>
        <div class="fd-pair" id="fd-pair"></div>
        <div class="fd-result" id="fd-result"></div>
      </aside>
    </section>

    <section class="band">
      <div class="band-head">
        <div><span class="kicker" data-i18n="home.newKicker"></span><h2 data-i18n="home.newTitle"></h2></div>
        <a href="creatures.html" class="btn btn-ghost" data-i18n="home.seeAll"></a>
      </div>
      <div class="new-grid" id="new-grid"></div>
    </section>

    <section class="band">
      <div class="band-head"><div><span class="kicker" data-i18n="home.stepsKicker"></span><h2 data-i18n="home.stepsTitle"></h2></div></div>
      <ol class="steps">
        <li><h3 data-i18n="home.step1"></h3><p data-i18n="home.step1.d"></p></li>
        <li><h3 data-i18n="home.step2"></h3><p data-i18n="home.step2.d"></p></li>
        <li><h3 data-i18n="home.step3"></h3><p data-i18n="home.step3.d"></p></li>
      </ol>
    </section>

    <section class="band">
      <div class="what">
        <div><h3 data-i18n="home.what1"></h3><p data-i18n-html="home.what1.d"></p></div>
        <div><h3 data-i18n="home.what2"></h3><p data-i18n="home.what2.d"></p></div>
        <div><h3 data-i18n="home.what3"></h3><p data-i18n="home.what3.d"></p></div>
      </div>
    </section>
  </main>

  <script src="js/i18n.js?v=25"></script>
  <script src="js/lang/pt-BR.js?v=25"></script>
  <script src="js/lang/pt-PT.js?v=25"></script>
  <script src="js/lang/en.js?v=25"></script>
  <script src="js/lang/es.js?v=25"></script>
  <script src="js/lang/fr.js?v=25"></script>
  <script src="js/lang/de.js?v=25"></script>
  <script src="js/layout.js?v=25"></script>
  <script src="js/creatures-data.js?v=25"></script>
  <script src="js/data.js?v=25"></script>
  <script src="js/mechanics.js?v=25"></script>
  <script src="js/sim.js?v=25"></script>
  <script>
    document.getElementById("f-count").textContent = CREATURES.length;

    // Duelo em destaque: dois tier 4–5 aleatórios, simulados na hora
    const pool = CREATURES.filter(c => c.tier >= 4);
    const blankOpts = () => ({ dmgPct: 0, hpPct: 0, elder: "none", ven: 0, traits: [{ type: "", level: 0 }, { type: "", level: 0 }], plush: ["", ""],
      buffs: { sin: 0, defensive: 0 }, actives: {}, breath: true, twoFaced: "tranq" });
    function feature() {
      const a = pool[Math.floor(Math.random() * pool.length)];
      let b; do { b = pool[Math.floor(Math.random() * pool.length)]; } while (b === a);
      const slots = [{ creature: a, opts: blankOpts() }, { creature: b, opts: blankOpts() }];
      const r = simulate(slots, { night: false }, a.weight >= b.weight ? 0 : 1, { log: false });
      const href = `simulator.html?c1=${encodeURIComponent(a.name)}&c2=${encodeURIComponent(b.name)}`;
      const side = (c, k) => `<a class="fd-side" href="${href}">
          ${avatarHTML(c)}<h3 style="color:var(--${k})">${c.name}</h3><small style="color:var(--muted)">Tier ${c.tier} · ${typePt(c.type)}</small></a>`;
      document.getElementById("fd-pair").innerHTML = side(a, "a") + `<span class="fd-x">×</span>` + side(b, "b");
      const w = r.fighters[r.winner];
      document.getElementById("fd-result").innerHTML = r.timeout
        ? `<span>${t("rep.draw")}</span>`
        : `<span>${t("home.featuredResult", { a: `<b>${w.name}</b>`, s: fmtD(r.time, 1), p: Math.round(Math.max(0, w.hp) / w.maxHp * 100) })}</span>
           <a class="btn btn-ghost" style="padding:6px 10px;font-size:13px" href="${href}">${t("home.seeReport")}</a>`;
    }
    document.getElementById("reroll").onclick = feature;
    feature();

    // Novidades
    const dateFmt = new Intl.DateTimeFormat(LOCALE);
    document.getElementById("new-grid").innerHTML = CREATURES.filter(isNew)
      .sort((a, b) => b.added.localeCompare(a.added))
      .map(c => `<a class="new-item" href="simulator.html?c1=${encodeURIComponent(c.name)}">
        ${avatarHTML(c)}<h4>${c.name}</h4><small>T${c.tier} · ${typePt(c.type)} · ${dateFmt.format(new Date(c.added + "T12:00:00"))}</small></a>`).join("");
  </script>
</body>
</html>
